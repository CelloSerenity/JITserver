[package]
name = "JITserver"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0"

[dependencies]
anyhow = "1"
eframe = "0.36.2"
futures = "0.3"
idevice = { version = "0.1.68", default-features = false, features = [
  "core_device",
  "core_device_proxy",
  "cryptexd",
  "debug_proxy",
  "dvt",
  "installation_proxy",
  "mobile_image_mounter",
  "ring",
  "rsd",
  "tss",
  "tunnel_tcp_stack",
  "usbmuxd",
] }
percent-encoding = "2.3"
plist = "1.9"
rfd = "0.17"
rquickjs = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.27", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
eframe = { version = "0.36.2", features = ["glow"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
pollster = "1.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
