[package]
name = "jitserver-web"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
idevice = { version = "=0.1.68", default-features = false, features = [
  "wasm", "pair", "core_device", "core_device_proxy", "cryptexd", "debug_proxy",
  "installation_proxy", "mobile_image_mounter", "remote_pairing", "rsd", "tunnel_tcp_stack",
] }
futures = "0.3"
js-sys = "0.3"
percent-encoding = "2.3"
plist = "1.9"
netmuxd = { git = "https://github.com/jkcoxson/netmuxd", rev = "7ce5620e2e2b738f736243a96d9f9a52a8044f90", default-features = false, features = ["wasm"] }
nusb = { git = "https://github.com/jkcoxson/nusb", branch = "fix/webusb-drop", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4"
web-sys = { version = "0.3", features = ["Window", "HtmlCanvasElement", "Navigator", "Storage", "Usb", "UsbDevice", "UsbDeviceFilter", "UsbDeviceRequestOptions"] }

[profile.release]
lto = "thin"
opt-level = "s"

[patch.crates-io]
idevice = { path = "vendor/idevice" }
